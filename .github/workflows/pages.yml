name: Publicar websites no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            conveniencia018/package-lock.json
            volpicontabilidade/package-lock.json
      - run: npm ci --prefix conveniencia018
      - run: npm ci --prefix volpicontabilidade
      - run: npm run lint
      - run: npm test
      - uses: actions/configure-pages@v5
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
